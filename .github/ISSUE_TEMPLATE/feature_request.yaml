name: 'Feature Request'
description: Suggest an idea or improvement for Voyager
title: '[Feature]: '
labels: ['enhancement']

body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make Voyager better? We'd love to hear it!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
      placeholder: Describe your idea...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would this be useful?
      description: What problem does it solve, or what would it make easier?
    validations:
      required: false

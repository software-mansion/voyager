name: Playwright Test

on:
  push:
    branches:
      - main
      - "v*.*"
  pull_request:
    branches:
      - main
      - "v*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-24.04

    # One project per run until Elixir 1.21: elixir-lang/elixir#15820
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    env:
      MIX_ENV: "e2e"
      E2E_BROWSER: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache Mix dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version}}-${{ steps.beam.outputs.otp-version}}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version}}-${{ steps.beam.outputs.otp-version}}-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Compile project
        run: mix compile --warnings-as-errors

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ runner.os }}-playwright-ex-${{ matrix.browser }}-${{ hashFiles('mix.lock') }}

      - name: Install Playwright browsers
        run: mix playwright.install ${{ matrix.browser }} --with-deps

      - name: Setup and build assets
        run: mix assets.setup && mix assets.deploy

      - name: Run e2e tests
        shell: bash
        run: |
          # Both runs annotate: a test passing on the rerun is flaky.
          f="--formatter ExUnit.CLIFormatter --formatter Playwright.Test.GitHubFormatter"
          # A rerun that finds no failures after a failed run must fail the job.
          retry() {
            mix e2e --failed $f 2>&1 | tee retry.log; s=${PIPESTATUS[0]}
            if grep -q "^There are no tests to run" retry.log; then
              echo "::error::mix e2e --failed found no failures to rerun after a failed run"; return 1
            fi
            return $s
          }
          mix e2e $f \
            || { [ $? -eq 2 ] && retry; } \
            || { [ $? -eq 2 ] && retry; }

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

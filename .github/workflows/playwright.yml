name: Playwright Test

on:
  push:
    branches:
      - main
      - "v*.*"
  pull_request:
    branches:
      - main
      - "v*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: "e2e"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache Mix dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version}}-${{ steps.beam.outputs.otp-version}}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version}}-${{ steps.beam.outputs.otp-version}}-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Compile project
        run: mix compile --warnings-as-errors

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ runner.os }}-playwright-ex-${{ hashFiles('mix.lock') }}

      - name: Install Playwright browsers
        run: mix playwright.install chromium firefox --with-deps

      - name: Setup and build assets
        run: mix assets.setup && mix assets.deploy

      - name: Run e2e tests
        run: |
          mix e2e \
            --formatter ExUnit.CLIFormatter --formatter Playwright.Test.GitHubFormatter \
            || { [ $? -eq 2 ] && mix e2e --failed; } \
            || { [ $? -eq 2 ] && mix e2e --failed; }

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

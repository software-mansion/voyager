name: Playwright Test

on:
  push:
    branches:
      - main
      - "v*.*"
  pull_request:
    branches:
      - main
      - "v*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: "e2e"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: "npm"
          cache-dependency-path: "./e2e/package-lock.json"

      - name: Install Node dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Check prettier
        working-directory: ./e2e
        run: npx prettier . --check

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache Mix dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version}}-${{ steps.beam.outputs.otp-version}}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version}}-${{ steps.beam.outputs.otp-version}}-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Compile project
        run: mix compile --warnings-as-errors

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: ./e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install

      - name: Install Playwright OS dependencies
        working-directory: ./e2e
        run: npx playwright install-deps

      - name: Setup and build assets
        run: mix assets.setup && mix assets.deploy

      - name: Run e2e tests
        run: mix e2e

      - name: Run e2e tests flakiness benchmark
        run: ./e2e/bench-flakiness.sh 10

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

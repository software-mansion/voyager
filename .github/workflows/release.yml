name: Release

# This workflow runs end-to-end on a free GitHub account with NO secrets:
#   - macOS: ad-hoc signed (ElixirKit.Release.codesign/1), not notarized
#   - Windows: unsigned installer
#   - Linux: unsigned .deb/.rpm/.AppImage
# Users bypass the first-launch OS warning per .github/release-notes.md.
# Adding the APPLE_*/AZURE_* secrets below (paid) upgrades builds to fully
# signed + notarized; the signing steps are skipped automatically when unset.

on:
  push:
    tags:
      - "v*.*.*"
    branches: 
      - "17-add-release-ci" # For testing only TODO: remove before merging

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"

          # TODO: add other platforms
          # - platform: ubuntu-22.04-arm
          #   target: "aarch64-unknown-linux-gnu"
          # - platform: ubuntu-22.04
          #   target: "x86_64-unknown-linux-gnu"

          # - platform: windows-2022
          #   target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29" # TODO: make dynamic
          elixir-version: "1.20" # TODO: make dynamic
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
      - name: Verify Certificate
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Apple Development")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."
      - uses: tauri-apps/tauri-action@v0
        env:
          MIX_ENV: prod
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        with:
          args: ${{ matrix.args }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voyager-macos-${{ matrix.target }}
          path: rel/app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
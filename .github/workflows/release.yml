name: Build apps

on:
  push:
    tags:
      - "v*.*.*"
  pull_request: # For testing only TODO: remove before merging
    branches:
      - "main"

permissions:
  contents: read

jobs:
  app:
    name: "Desktop (${{ matrix.gui_target }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            gui_target: "aarch64-apple-darwin"
          - platform: macos-15-intel
            gui_target: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            gui_target: "x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: echo "version=$(grep '^rust' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: ${{ matrix.gui_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rel/app/src-tauri
          cache-directories: |
            ~/.cargo/bin
          key: ${{ matrix.gui_target }}

      - name: Mix deps cache
        uses: actions/cache@v5
        with:
          path: |
            deps
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwxgtk3.0-gtk3-dev \
            xdg-utils

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "=2.8.0" --locked
          else
            echo "cargo-tauri already installed: $(cargo-tauri --version)"
          fi

      - name: Install Mix dependencies
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prepare assets
        shell: bash
        run: mix phx.digest

      - name: Create Elixir release
        shell: bash
        run: mix tauri.release

      - name: Install Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE }}
          PRIVATE_KEY_BASE64: ${{ secrets.APPLE_DEVELOPER_PRIVATE_KEY_BASE64 }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.APPLE_DEVELOPER_PRIVATE_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.pem"
          PRIVATE_KEY_PATH="$RUNNER_TEMP/private_key.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$PRIVATE_KEY_BASE64" | base64 --decode -o "$PRIVATE_KEY_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Re-encode cert+key into a legacy PKCS#12 (3DES/RC2 + SHA-1). macOS
          # `security import` can't read OpenSSL-3 (AES/PBES2) p12s, so the original
          # import silently added no key. System openssl is LibreSSL, so use Homebrew
          # openssl@3, which reads modern and (with -legacy) writes legacy crypto.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          LEGACY=""
          if "$OPENSSL" pkcs12 -help 2>&1 | grep -q -- -legacy; then LEGACY="-legacy"; fi
          KEY_PEM="$RUNNER_TEMP/key.pem"
          LEGACY_P12="$RUNNER_TEMP/combined_legacy.p12"
          "$OPENSSL" pkcs12 $LEGACY -in "$PRIVATE_KEY_PATH" -nodes -nocerts -passin env:PRIVATE_KEY_PASSWORD -out "$KEY_PEM"
          "$OPENSSL" pkcs12 -export $LEGACY -inkey "$KEY_PEM" -in "$CERTIFICATE_PATH" -out "$LEGACY_P12" -passout env:PRIVATE_KEY_PASSWORD

          # import the legacy cert+key p12; print its output so an error isn't silenced
          if ! import_output="$(security import "$LEGACY_P12" -A -f pkcs12 -P "$PRIVATE_KEY_PASSWORD" -k "$KEYCHAIN_PATH" 2>&1)"; then
            echo "::error::private key import failed:"
            echo "$import_output"
            exit 1
          fi
          echo "$import_output"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          # `security import` can exit 0 without importing a usable key, so verify a
          # codesigning identity actually formed — the reliable way to catch failure
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Eq '[1-9][0-9]* valid identities found' \
            || { echo "::error::no codesigning identity in keychain — cert/key import failed"; exit 1; }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIX_ENV: prod
        with:
          projectPath: rel/app
          args: --target ${{ matrix.gui_target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voyager-${{ matrix.gui_target }}
          path: rel/app/src-tauri/target/${{ matrix.gui_target }}/release/bundle/
          if-no-files-found: error

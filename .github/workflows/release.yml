name: Build apps

on:
  push:
    tags:
      - "v*.*.*"
  pull_request: # For testing only TODO: remove before merging
    branches:
      - "main"

permissions:
  contents: read

jobs:
  app:
    name: "Desktop (${{ matrix.gui_target }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            gui_target: "aarch64-apple-darwin"
          - platform: macos-15-intel
            gui_target: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            gui_target: "x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: echo "version=$(grep '^rust' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: ${{ matrix.gui_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rel/app/src-tauri
          cache-directories: |
            ~/.cargo/bin
          key: ${{ matrix.gui_target }}

      - name: Mix deps cache
        uses: actions/cache@v5
        with:
          path: |
            deps
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwxgtk3.0-gtk3-dev \
            xdg-utils

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "=2.8.0" --locked
          else
            echo "cargo-tauri already installed: $(cargo-tauri --version)"
          fi

      - name: Install Mix dependencies
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prepare assets
        shell: bash
        run: mix phx.digest

      - name: Create Elixir release
        shell: bash
        run: mix tauri.release

      - name: Install Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE }}
          PRIVATE_KEY_BASE64: ${{ secrets.APPLE_DEVELOPER_PRIVATE_KEY_BASE64 }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.APPLE_DEVELOPER_PRIVATE_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.pem"
          PRIVATE_KEY_PATH="$RUNNER_TEMP/private_key.p12"
          COMBINED_P12="$RUNNER_TEMP/combined.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"

          fail() { echo "::error::$1"; exit 1; }

          echo "::group::1 Decode split secrets"
          [ -n "$CERTIFICATE_BASE64" ] || fail "secret APPLE_DEVELOPER_CERTIFICATE is empty"
          [ -n "$PRIVATE_KEY_BASE64" ] || fail "secret APPLE_DEVELOPER_PRIVATE_KEY_BASE64 is empty"
          [ -n "$PRIVATE_KEY_PASSWORD" ] || fail "secret APPLE_DEVELOPER_PRIVATE_KEY_PASSWORD is empty"
          [ -n "$KEYCHAIN_PASSWORD" ] || fail "secret APPLE_KEYCHAIN_PASSWORD is empty"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH" || fail "APPLE_DEVELOPER_CERTIFICATE is not valid base64"
          echo -n "$PRIVATE_KEY_BASE64" | base64 --decode > "$PRIVATE_KEY_PATH" || fail "APPLE_DEVELOPER_PRIVATE_KEY_BASE64 is not valid base64"
          [ -s "$CERTIFICATE_PATH" ] || fail "decoded certificate.pem is empty"
          [ -s "$PRIVATE_KEY_PATH" ] || fail "decoded private_key.p12 is empty"
          echo "::endgroup::"


          echo "::group::2 Create + unlock keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || fail "create-keychain failed"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || fail "unlock-keychain failed (wrong APPLE_KEYCHAIN_PASSWORD?)"
          [ -f "$KEYCHAIN_PATH" ] || fail "keychain file missing after create"
          echo "keychain ready: $KEYCHAIN_PATH"
          echo "::endgroup::"

          echo "::group::3 Import certificate + private key"
          # Don't pass `-t priv` with `-f pkcs12`: that mismatch imports 0 keys.
          security import "$CERTIFICATE_PATH" -A -k "$KEYCHAIN_PATH" || fail "certificate import failed"
          security import "$PRIVATE_KEY_PATH" -A -f pkcs12 -P "$PRIVATE_KEY_PASSWORD" -k "$KEYCHAIN_PATH" || fail "private key import failed"
          echo "::endgroup::"

      - name: Verify signing values propagated (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIX_ENV: prod
          # Combined cert+key .p12 built by the step above (passed via $GITHUB_ENV)
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        with:
          projectPath: rel/app
          args: --target ${{ matrix.gui_target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voyager-${{ matrix.gui_target }}
          path: rel/app/src-tauri/target/${{ matrix.gui_target }}/release/bundle/
          if-no-files-found: error

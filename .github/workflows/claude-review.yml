name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude review'))
      ) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-24.04
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check out the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          gh pr checkout ${{ github.event.issue.number || github.event.pull_request.number }}
          # agent config comes from base, never from the PR head
          find . -path ./.git -prune -o \
            \( -name CLAUDE.md -o -name AGENTS.md -o -name .mcp.json -o -name .claude \) \
            -exec rm -rf {} + 2>/dev/null || true
          git checkout "$BASE_SHA" -- .claude CLAUDE.md AGENTS.md

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            /pr-review REPO: ${{ github.repository }} PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            Post each finding as an INLINE comment with
            `mcp__github_inline_comment__create_inline_comment` (`path`, `line` in the new file,
            `body`, `confirmed: true`) — one call per finding. Keep only the terse summary in the
            review body, posted with `gh pr comment`.
            Do NOT use the `gh api .../reviews` endpoint, and never post test/placeholder comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude review'))
      ) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-24.04
    env:
      TRIGGER_BODY: ${{ github.event.comment.body || github.event.review.body }}
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Prompt injection: everything on the PR head is untrusted input. Before the
      # agent starts, the action replaces .claude/, CLAUDE.md, CLAUDE.local.md,
      # .mcp.json, .claude.json, .gitmodules, .ripgreprc and .husky with the base
      # branch copies, so a PR cannot ship its own skill, MCP server or settings and
      # get them executed. The PR's versions are snapshotted to .claude-pr/ unexecuted.
      # https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Call the Skill tool with `pr-review` NOW, before anything else, and follow it
            exactly. REPO: ${{ github.repository }} PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            The skill outranks every instruction outside these custom instructions. Its output
            format is the whole output: no h3 header, no todo checklist, no summary of what you
            could not run, no closing remark.

            Post each finding as an INLINE comment with
            `mcp__github_inline_comment__create_inline_comment` (`path`, `line` in the new file,
            `body`, `confirmed: true`) — one call per finding. Keep only the terse summary in the
            tracking comment, updated with `mcp__github_comment__update_claude_comment`.
            `track_progress` mode forbids creating new comments — never open a separate one.
            Never post test or placeholder comments.
          claude_args: |
            ${{ contains(env.TRIGGER_BODY, '@claude review opus') && '--model opus' || '--model sonnet' }}
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number || github.event.pull_request.number }}/comments:*)"
